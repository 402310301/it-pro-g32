# ------------------------------------------------------------------
# Intelligent Surplus Food Redistribution System - settings
# ------------------------------------------------------------------

# Web server port. Open http://localhost:8080 after starting the app.
server.port=8080

# MySQL connection. The database "food_redistribution" is created
# automatically the first time the app starts (createDatabaseIfNotExist).
db.url=jdbc:mysql://localhost:3306/food_redistribution?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
db.user=root
# Put your own MySQL root password here.
db.password=root123

# Load the Cape Town demo data when the database is empty (true/false).
demo.seed=true

# Every setting can also be overridden with an environment variable, e.g.
# DB_PASSWORD=secret, DB_USER=app, DB_URL=..., SERVER_PORT=9090
